<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio.">
  <meta name="theme-color" content="#fbfaff">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Simran Rekhi · Portfolio">
  <meta property="og:description" content="Personal portfolio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23e8e1f7'/%3E%3Cpath d='M4 24 L13 9 L18 17 L21 13 L28 24 Z' fill='%235b3f7d'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preload" as="image" href="images/avatar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#top">Skip to content</a>

  <div class="trail" aria-hidden="true">
    <svg class="trail-peak" viewBox="0 0 24 18"><path d="M1 17 L8 3 L12 9 L15 6 L23 17 Z"/></svg>
    <span class="trail-path"></span>
    <span class="hiker"></span>
  </div>

  <header class="top">
    <a class="logo" href="#top" id="logo" aria-label="Back to top">hi</a>
    <div class="top-right">
      <nav aria-label="Main">
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#treks">Trails</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top" tabindex="-1">
    <section class="hero">
      <canvas class="snow" id="snow" aria-hidden="true"></canvas>
      <div class="hero-text">
        <h1 id="name" aria-live="off"></h1>
        <p id="tagline" class="tagline"></p>
        <a class="cta" href="#projects">See my projects</a>
      </div>

      <div class="hero-art">
        <img class="avatar" src="images/avatar.png" width="413" height="900" fetchpriority="high" alt="Cartoon illustration of a smiling woman with long dark hair, a black jacket and sunglasses on her head">
        <svg class="badge" viewBox="0 0 200 200" aria-hidden="true">
          <defs><path id="circle" d="M100,100 m-76,0 a76,76 0 1,1 152,0 a76,76 0 1,1 -152,0"/></defs>
          <g class="spin">
            <text><textPath href="#circle" id="badge-text" textLength="470" lengthAdjust="spacing"></textPath></text>
          </g>
          <circle class="dot" cx="100" cy="100" r="22"/>
        </svg>
      </div>
    </section>

    <svg class="ridge" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="ridge-far" d="M0 96 L160 54 L250 78 L390 30 L520 80 L660 44 L800 86 L960 40 L1120 78 L1270 48 L1440 92 L1440 150 L0 150 Z"/>
      <path class="ridge-near" d="M0 112 L120 84 L230 100 L360 66 L470 96 L610 72 L740 104 L880 70 L1010 98 L1160 76 L1300 104 L1440 86 L1440 150 L0 150 Z"/>
    </svg>

    <section id="about" class="block">
      <h2>About</h2>
      <div class="block-body about-wrap">
        <figure class="photo">
          <img src="images/photo.jpg" width="800" height="1200" loading="lazy" alt="Portrait photo of a smiling woman with wavy dark red hair, wearing a black polka-dot blouse and black trousers">
        </figure>
        <div id="about-body"></div>
      </div>
    </section>

    <section id="work" class="block">
      <h2>What I do</h2>
      <div class="block-body">
        <ul class="skills" id="skills"></ul>
      </div>
    </section>

    <section id="treks" class="block">
      <h2>Trails</h2>
      <div class="block-body">
        <ul class="treks" id="trek-list"></ul>
      </div>
    </section>

    <section id="projects" class="block">
      <h2>Projects</h2>
      <div class="block-body">
        <ul class="repos" id="repo-list" aria-live="polite">
          <li class="repo-status">Loading projects from GitHub…</li>
        </ul>
      </div>
    </section>

    <section id="contact" class="block">
      <h2>Contact</h2>
      <div class="block-body">
        <p id="contact-text"></p>
        <ul class="links" id="links"></ul>
      </div>
    </section>
  </main>

  <footer class="foot"><p id="foot"></p></footer>

  <script src="script.js"></script>
</body>
</html>
