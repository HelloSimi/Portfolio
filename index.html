<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio.">
  <meta name="theme-color" content="#fbfaff">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Simran Rekhi · Portfolio">
  <meta property="og:description" content="Personal portfolio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23e8e1f7'/%3E%3Cpath d='M4 24 L13 9 L18 17 L21 13 L28 24 Z' fill='%235b3f7d'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preload" as="image" href="images/avatar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#top">Skip to content</a>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-pack" viewBox="0 0 18 18">
      <path d="M7 6V4.8a2 2 0 0 1 4 0V6"/>
      <path d="M5.4 6h7.2a2 2 0 0 1 2 2v5.6a1 1 0 0 1-1 1H4.4a1 1 0 0 1-1-1V8a2 2 0 0 1 2-2z"/>
      <path d="M6.6 11h4.8"/>
    </symbol>
    <symbol id="icon-lantern" viewBox="0 0 18 18">
      <path d="M9 2.2V4"/>
      <path d="M6.2 4h5.6"/>
      <path d="M7.2 4.8 6.4 13.6h5.2L10.8 4.8z"/>
    </symbol>
    <symbol id="icon-boot" viewBox="0 0 18 18">
      <path d="M5 3.6h3.4v5l3.6 1.4c.9.4 1.5 1.2 1.5 2.2v.9H5a1.5 1.5 0 0 1-1.5-1.5V5.1A1.5 1.5 0 0 1 5 3.6z"/>
      <path d="M4 6.6h4.4"/>
    </symbol>
  </svg>

  <div class="trail" aria-hidden="true">
    <svg class="trail-peak" viewBox="0 0 24 18"><path d="M1 17 L8 3 L12 9 L15 6 L23 17 Z"/></svg>
    <span class="trail-path"></span>
    <span class="hiker"></span>
  </div>

  <header class="top">
    <a class="logo" href="#top" id="logo" aria-label="Back to top">hi</a>
    <div class="top-right">
      <nav aria-label="Main">
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#treks">Trails</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="top" tabindex="-1">
    <div class="scene-band">
      <svg class="sky" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
        <g class="sc-stars" fill="var(--accent)">
          <circle cx="188" cy="54" r="1.7" opacity=".28"/>
          <circle cx="366" cy="102" r="1.2" opacity=".20"/>
          <circle cx="610" cy="40" r="1.5" opacity=".24"/>
          <circle cx="842" cy="88" r="1.2" opacity=".18"/>
          <circle cx="1032" cy="48" r="1.8" opacity=".28"/>
          <circle cx="1228" cy="106" r="1.2" opacity=".20"/>
          <circle cx="1354" cy="62" r="1.4" opacity=".24"/>
          <circle cx="508" cy="150" r="1.1" opacity=".16"/>
        </g>
      </svg>

      <svg class="scene" viewBox="0 0 1440 460" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <path id="pine" d="M0 -30 L7 -16 L4 -16 L10 -5 L6 -5 L13 4 L-13 4 L-6 -5 L-10 -5 L-4 -16 L-7 -16 Z"/>
        </defs>

        <g class="sc-far" fill="var(--ice)">
          <path d="M0 190 L120 110 L190 150 L300 56 L396 140 L470 100 L560 168 L660 86 L762 156 L870 72 L980 150 L1090 104 L1200 164 L1320 90 L1440 156 L1440 460 L0 460 Z"/>
          <g fill="var(--surface)" opacity=".8">
            <path d="M300 56 L330 86 L311 90 L284 83 Z"/>
            <path d="M660 86 L687 113 L669 117 L645 111 Z"/>
            <path d="M870 72 L899 100 L880 104 L855 97 Z"/>
            <path d="M1320 90 L1346 115 L1328 119 L1305 113 Z"/>
          </g>
        </g>

        <g class="sc-mid" fill="var(--lavender)">
          <path d="M0 270 L150 196 L250 238 L360 170 L470 226 L600 184 L720 246 L840 190 L960 240 L1080 200 L1200 256 L1320 210 L1440 250 L1440 460 L0 460 Z"/>
        </g>

        <g class="sc-near" fill="var(--blush)">
          <path d="M0 350 L160 300 L280 334 L420 288 L560 330 L700 298 L840 338 L980 302 L1120 338 L1280 306 L1440 344 L1440 460 L0 460 Z"/>
        </g>

        <g class="sc-trees">
          <g fill="var(--pine-2)">
            <use href="#pine" transform="translate(104 454) scale(.66)"/>
            <use href="#pine" transform="translate(262 456) scale(.56)"/>
            <use href="#pine" transform="translate(470 454) scale(.72)"/>
            <use href="#pine" transform="translate(898 454) scale(.82)"/>
            <use href="#pine" transform="translate(1012 456) scale(.66)"/>
            <use href="#pine" transform="translate(1148 454) scale(.88)"/>
            <use href="#pine" transform="translate(1286 456) scale(.7)"/>
          </g>
          <g fill="var(--pine)">
            <use href="#pine" transform="translate(176 458) scale(.86)"/>
            <use href="#pine" transform="translate(556 458) scale(.94)"/>
            <use href="#pine" transform="translate(956 458) scale(1.06)"/>
            <use href="#pine" transform="translate(1086 458) scale(.9)"/>
            <use href="#pine" transform="translate(1222 458) scale(1.1)"/>
            <use href="#pine" transform="translate(1352 458) scale(.96)"/>
          </g>
          <g class="sc-fore" fill="var(--pine)">
            <use href="#pine" transform="translate(28 462) scale(2.1)"/>
            <use href="#pine" transform="translate(1416 462) scale(2.4)"/>
          </g>
        </g>
      </svg>
      <svg class="camp" viewBox="0 0 120 100" aria-hidden="true">
        <path class="ground" d="M2 87 C24 84.5 58 89 118 86.5"/>
      
        <!-- ridge tent -->
        <path class="t-back" d="M33 44 L43 40 L66 86 L56 86 Z"/>
        <path class="t-body" d="M33 44 L10 86 L56 86 Z"/>
        <path class="t-door" d="M33 50 L25 86 L41 86 Z"/>
        <path class="guy" d="M10 86 L4 89"/>
        <path class="guy" d="M56 86 L62 89"/>
      
        <!-- campfire -->
        <path class="log" d="M79 87 L97 81"/>
        <path class="log" d="M80 81 L98 87"/>
        <path class="log" d="M85 88 L93 79"/>
        <path class="fl fl-a" d="M88 64 C93 70 93 77 88 81 C83 77 83 70 88 64 Z"/>
        <path class="fl fl-c" d="M84 71 C86 74 86 78 84 81 C82 78 82 74 84 71 Z"/>
        <path class="fl fl-b" d="M88 69 C90.5 73 90.5 78 88 81 C85.5 78 85.5 73 88 69 Z"/>
      
        <!-- smoke -->
        <circle class="puff puff-1" cx="89" cy="58" r="3"/>
        <circle class="puff puff-2" cx="92" cy="50" r="2.5"/>
        <circle class="puff puff-3" cx="88" cy="42" r="2"/>
      </svg>
      <div class="ground" aria-hidden="true">
        <svg class="trek-trail" viewBox="0 0 520 90" aria-hidden="true" focusable="false">
          <defs>
            <g id="bootprint">
              <ellipse cx="0" cy="-1.4" rx="3" ry="4"/>
              <path d="M-1.7 4.4h3.4"/>
            </g>
            <!-- the wipe: a fat white stroke whose dashoffset reveals the dotted trail -->
            <mask id="trail-wipe" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="90">
              <rect class="wipe" x="0" y="0" width="520" height="90" fill="#fff"/>
            </mask>
          </defs>
        
          <path class="trail-line" d="M8 68C72 68 98 40 162 38s96 22 168 20 94-28 174-32" mask="url(#trail-wipe)"/>
        
          <g class="prints">
            <g class="bp" style="--n:.08" transform="translate(40 72) rotate(-5)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.19" transform="translate(96 46) rotate(-16)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.29" transform="translate(152 45) rotate(-13)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.40" transform="translate(208 46) rotate(-3)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.51" transform="translate(264 55) rotate(5)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.62" transform="translate(320 61) rotate(8)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.72" transform="translate(376 56) rotate(-6)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.83" transform="translate(432 44) rotate(-14)"><use href="#bootprint"/></g>
            <g class="bp" style="--n:.94" transform="translate(488 34) rotate(-11)"><use href="#bootprint"/></g>
          </g>
        </svg>
      </div>
      <canvas class="snow" id="snow" aria-hidden="true"></canvas>
    <section class="hero">
      <div class="hero-text">
        <h1 id="name" aria-live="off"></h1>
        <p id="tagline" class="tagline"></p>
        <a class="cta" href="#projects">See my projects</a>
      </div>

      <div class="hero-art">
        <img class="avatar" src="images/avatar.png" width="413" height="900" fetchpriority="high" alt="Cartoon illustration of a smiling woman with long dark hair, a black jacket and sunglasses on her head">
        <svg class="badge" viewBox="0 0 200 200" aria-hidden="true">
          <defs><path id="circle" d="M100,100 m-76,0 a76,76 0 1,1 152,0 a76,76 0 1,1 -152,0"/></defs>
          <g class="spin">
            <text><textPath href="#circle" id="badge-text" textLength="470" lengthAdjust="spacing"></textPath></text>
          </g>
          <circle class="dot" cx="100" cy="100" r="22"/>
        </svg>
      </div>
    </section>

      <section class="portrait" id="portrait">
        <figure class="photo">
          <img src="images/photo.png" width="800" height="1200" loading="lazy" decoding="async" alt="Portrait photo of a smiling woman with wavy dark red hair, wearing a black polka-dot blouse and black trousers">
        </figure>
      </section>
    </div>

    <section id="about" class="block">
      <h2>About</h2>
      <div class="block-body about-wrap">
        <div id="about-body"></div>
      </div>
    </section>

    <section id="work" class="block">
      <h2>What I do</h2>
      <div class="block-body">
        <ul class="skills" id="skills"></ul>
      </div>
    </section>

    <section id="treks" class="block">
      <h2>Trails</h2>
      <div class="block-body">
        <ul class="treks" id="trek-list"></ul>
      </div>
    </section>

    <section id="projects" class="block">
      <h2>Projects</h2>
      <div class="block-body">
        <ul class="repos" id="repo-list" aria-live="polite">
          <li class="repo-status">Loading projects from GitHub…</li>
        </ul>
      </div>
    </section>

    <section id="contact" class="block">
      <h2>Contact</h2>
      <div class="block-body">
        <p id="contact-text"></p>
        <ul class="links" id="links"></ul>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p id="foot"></p>
    <svg class="compass" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true" focusable="false">
      <circle cx="22" cy="22" r="18.5"/>
      <path d="M22 3.5v4M22 36.5v4M3.5 22h4M36.5 22h4"/>
      <path class="cp-needle" d="M22 8l4.2 14L22 36l-4.2-14z"/>
      <circle class="cp-hub" cx="22" cy="22" r="1.5"/>
    </svg>
  </footer>

  <template id="div-ridge">
    <svg class="seam seam-ridge" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
      <path class="seam-band" d="M0 32 L240 24 L520 31 L800 23 L1080 30 L1440 25 L1440 32 L1080 37 L800 30 L520 38 L240 31 L0 39 Z"/>
    </svg>
  </template>
  <template id="div-pine">
    <svg class="seam seam-pine" viewBox="0 0 1440 48" aria-hidden="true">
      <path class="seam-pines" d="M100 32 l2 -7 l-1 0 l2 -7 l-1 0 l3 -7 l3 7 l-1 0 l2 7 l-1 0 l2 7 z m350 1 l2 -7 l-1 0 l2 -7 l-1 0 l3 -7 l3 7 l-1 0 l2 7 l-1 0 l2 7 z m340 -6 l2 -7 l-1 0 l2 -7 l-1 0 l3 -7 l3 7 l-1 0 l2 7 l-1 0 l2 7 z m360 5 l2 -7 l-1 0 l2 -7 l-1 0 l3 -7 l3 7 l-1 0 l2 7 l-1 0 l2 7 z"/>
      <path class="seam-pines" d="M300 28 l1.4 -5 l-0.7 0 l1.4 -5 l-0.7 0 l2.1 -5 l2.1 5 l-0.7 0 l1.4 5 l-0.7 0 l1.4 5 z m300 3 l1.4 -5 l-0.7 0 l1.4 -5 l-0.7 0 l2.1 -5 l2.1 5 l-0.7 0 l1.4 5 l-0.7 0 l1.4 5 z m300 -3 l1.4 -5 l-0.7 0 l1.4 -5 l-0.7 0 l2.1 -5 l2.1 5 l-0.7 0 l1.4 5 l-0.7 0 l1.4 5 z m150 4 l1.4 -5 l-0.7 0 l1.4 -5 l-0.7 0 l2.1 -5 l2.1 5 l-0.7 0 l1.4 5 l-0.7 0 l1.4 5 z m280 -3 l1.4 -5 l-0.7 0 l1.4 -5 l-0.7 0 l2.1 -5 l2.1 5 l-0.7 0 l1.4 5 l-0.7 0 l1.4 5 z"/>
      <path class="seam-band" d="M0 32 L240 24 L520 31 L800 23 L1080 30 L1440 25 L1440 32 L1080 37 L800 30 L520 38 L240 31 L0 39 Z"/>
    </svg>
  </template>

  <script src="script.js"></script>
</body>
</html>
